# Run from uniphysgen/; paths follow the README preprocessing layout.

### model
# Checkpoint produced by configs/semantic_alignment.yaml.
model_name_or_path: outputs/semantic_alignment
trust_remote_code: true
task_name: object_level

### method
do_train: true
freeze_motion_head: true

### dataset
# Top-level key in dataset_info.json; separate multiple keys with commas.
dataset: uniphys_40k_object_level
# Task directory containing train.json and dataset_info.json.
dataset_dir: data/UniPhys-40K-processed/train/object_level
# NPZ root passed to generate_jsons_for_training.py via --npz_dir.
media_dir: data/UniPhys-40K-processed/npzs
# Dataset cache, not model weights: the first run saves and exits; rerun to train.
# Use a new cache path when changing data/media paths, or set null to disable it.
save_dir: data/UniPhys-40K-processed/cache/object_level
template: physmeshllm_qwen
num_bins: 256
do_augmentation: false
random_rotation: true
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 8
random_xyz_rotation: true

### output
output_dir: outputs/object_level
logging_steps: 10
save_steps: 500
overwrite_output_dir: false
save_total_limit: 5

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 5
learning_rate: 1.0e-5
num_train_epochs: 6
lr_scheduler_type: cosine
warmup_ratio: 0.03
pure_bf16: false
bf16: true
fp16: false
tf32: true
ddp_timeout: 180000000
report_to: wandb # choices: [none, wandb, tensorboard, swanlab]
max_new_tokens: 4096

### eval
val_size: 0.0001
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
