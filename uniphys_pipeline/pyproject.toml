[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniphys-pipeline"
version = "0.1.0"
description = "Pipeline for 3D part decomposition, physical annotation, kinematic modeling, and MuJoCo validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "UniPhys Pipeline contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
runtime = [
  "matplotlib>=3.8,<4",
  "mlxtend>=0.23,<0.24",
  "mujoco>=3.3,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<2",
  "open3d>=0.19,<0.20",
  "openai>=2,<3",
  "opencv-python>=4.9,<5",
  "OpenEXR>=3,<4",
  "pandas>=2,<3",
  "pillow>=10,<12",
  "pygltflib>=1.16,<2",
  "rtree>=1.4.1,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "trimesh>=4,<5",
]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
uniphys-pipeline = "uniphys.cli:main"

[tool.setuptools]
py-modules = ["pipeline"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["uniphys*", "utils*", "category*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "excute_*.py",
  "samples_*.py",
  "utils/partfield",
  "utils/sam2",
  "utils/blender/paper_pic",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
follow_imports = "skip"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
